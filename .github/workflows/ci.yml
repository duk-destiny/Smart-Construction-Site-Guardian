name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install dependencies
        # 块标量：单行写法里 ":all: -r" 的冒号会被 YAML 当映射键，
        # 自 v0.6 起工作流一直 startup failure（云端测试从未真正执行）
        run: |
          pip install --disable-pip-version-check --only-binary :all: -r requirements.txt
      - name: Lint (ruff)
        # 锁版与本地一致(0.15.20),避免云端新规则造成行为漂移;
        # --only-binary :all: 防 setup.py 执行(S8541/S8544)
        run: |
          pip install --disable-pip-version-check --only-binary :all: ruff==0.15.20
          ruff check agents api core dao services ui scripts app.py
      # Phase 1 配置出库后真实 config.yaml 不入 git：CI 用 example 引导
      # （fresh clone 与本仓库测试均假设 config/config.yaml 存在）
      - name: Bootstrap config from example
        run: cp config/config.example.yaml config/config.yaml
      - name: Dependency audit (pip-audit)
        # v0.8：依赖漏洞扫描。已知锁死版本可能存在无升级可用的 advisory，
        # 先以 continue-on-error 观察运行，出现告警后逐项评估 --ignore-vuln 收口。
        continue-on-error: true
        run: |
          pip install --disable-pip-version-check --only-binary :all: pip-audit==2.10.1
          pip-audit -r requirements.txt --skip-editable
      - name: Run tests
        run: python scripts/run_tests.py
