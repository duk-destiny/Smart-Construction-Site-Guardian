services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: python -c 'import urllib.request;urllib.request.urlopen("http://localhost:8501/_stcore/health",timeout=5)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # Phase 2 前后端分离：FastAPI 接口层（React 前端产物由其静态挂载，单端口 8000）
  # 注意：容器内访问宿主 Ollama 需把 config.yaml 的 llm.base_url 改为
  #   http://host.docker.internal:11434 （现有 localhost 配置在容器内不可达；
  #   extra_hosts 在 Linux 宿主上经 host-gateway 映射，Docker Desktop 原生支持）
  api:
    build: .
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      # 生产必改：JWT 签名密钥（留空则每次重启全体登录态失效）
      # API_JWT_SECRET: "change-me-to-a-long-random-string"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: python -c 'import urllib.request;urllib.request.urlopen("http://localhost:8000/healthz",timeout=5)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
