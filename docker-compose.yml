services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: python -c 'import urllib.request;urllib.request.urlopen("http://localhost:8501/_stcore/health",timeout=5)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
