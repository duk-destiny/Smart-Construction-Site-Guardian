# 智护工地 · 施工安全智能体 —— 全局配置
# 所有路径相对于项目根目录；敏感值不入库不进代码（C4）。
models:
  # 默认火情检测模型（兜底用；场景化后优先读 scenes.<scene>.yolo_weights）
  yolo_onnx: data/models/yolov8_fire_smoke_v2.onnx   # 火情检测模型（Fire/default/smoke 3 类，已导出 ONNX）
  yolo_class_map:                                # 模型类名 → 项目隐患键（None=忽略）
    spark: spark
    smoke: smoke
    extinguisher: extinguisher
  bge_dir: data/models/BAAI--bge-small-zh-v1.5/snapshots/master  # 本地中文 Embedding 模型

kb:
  pdf_dir: data/kb                            # 规范 PDF 存放目录
  collection: kb_hot_work                    # Chroma 集合名（默认场景）
  chroma_dir: data/kb/chroma                  # 向量库持久化目录

infer:
  conf_thres: 0.45        # 检测置信度阈值，低于此值视为误报（见融合规则）
  iou_thres: 0.45         # NMS 重叠阈值，去除重复检测框
  video_max_sec: 10       # 视频抽帧最长秒数
  video_fps: 1            # 抽帧频率（帧/秒）
  intra_op_threads: 0     # 每个ONNX会话intra-op线程上限(0=自动≈物理核/引擎数，防抢核；小模型线程宜少)

llm:
  enabled: true                       # 本地 LLM 文案润色开关（可选增强）
  base_url: http://localhost:11434    # Ollama 本机地址，仅 localhost 通信（C1）
  model: qwen3:8b                      # 本地 LLM，断网自动降级（C2）
  think: false                        # 关 qwen3 思考（思考会吞 num_predict 致空输出；非思考模型忽略）
  num_predict: 220                    # 润色 token 上限（异步路径，不进 ≤8s 主链路）
  temperature: 0.3                    # 低温度，贴近给定信息、抑制编造
  keep_alive: "30m"                   # ollama 模型常驻时长（app 启动后台预热一次；冷启 11s→热 3s）

# 多场景危险检测配置：每个场景 = 一组检测头 + 知识库 + 风险矩阵
# 视觉 Agent 按场景加载 yolo_weights（可多个，含 PPE 头）；
scenes:
  hot_work:                                            # 动火作业安全（默认场景）
    conf_thres: 0.35
    yolo_weights:
      - path: data/models/yolov8_fire_smoke_v2.onnx
        class_map:
          spark: spark
          smoke: smoke
          extinguisher: extinguisher
    kb_collection: kb_hot_work
    risk_matrix: config/rules/hot_work.yaml
  construction_ppe:                                    # 施工 PPE / 危险检测
    conf_thres: 0.25
    yolo_weights:
      # 核心 PPE 头：沿用 industrial-safety-vision 工程路线（YOLO+ONNX）
      # 权重由该流水线训练/导出后放置于此路径即可启用，缺省则优雅跳过
      # 类名需与训练数据集 data.yaml 的 names 完全一致（见 construction-safety-gsnvb）
      - path: data/models/ppe_yolov8_v3.onnx
        class_map:
          helmet: helmet
          no_helmet: no_helmet
          no_vest: no_vest
          vest: vest
          person: person
    kb_collection: kb_ppe
    risk_matrix: config/rules/construction_ppe.yaml

# 三级合规严重度映射（数据驱动，C2）：键=项目隐患键，值=safe/warning/critical
# 实时态与历史分析据此将检测项归并为 合规/警告/不合规。可在不改动代码的前提下调整分级。
compliance:
  severity:
    spark: critical
    smoke: critical
    no_helmet: critical
    face_shield: safe
    extinguisher: safe
    flammable: warning
    no_vest: warning
    helmet: safe
    vest: safe
    person: safe

# ================= 告警外部推送（P0/P1）=================
# 默认关闭；开启后，实时监测/后台轮询产生的高危告警会自动推送到 webhook。
# channel 支持：wecom（企业微信机器人）/ dingtalk（钉钉机器人）/ generic（通用 JSON webhook）
notify:
  enabled: false
  demo_mode: false             # 演示模式：true 时跳过真实 HTTP，捕获 payload 到 data/mock_capture.jsonl（管理端可会话级开关）
  channel: generic
  webhook_url: ""            # 机器人 webhook 地址，例如 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
  timeout_sec: 5             # 单次 HTTP 超时（秒）
  retries: 2                 # 失败重试次数（不含首次）
  cooldown_sec: 60           # 后台轮询下同源同类告警的推送冷却（秒）
  image_base_url: ""         # 证据截图可访问前缀（如 http://192.168.1.10:8501），留空则只发相对路径

# ================= 后台 RTSP 自动轮询监控（P0/P1）=================
# 默认关闭；开启后 app 启动即按 interval_sec 轮询 sources，critical 帧自动告警+推送
monitor:
  enabled: false
  interval_sec: 3            # 轮询采样节奏（秒）；告警 SLA = 下一采样 ≤ 此值，火情关键源建议 ≤3s（注：采样节奏非推理延迟，亚秒级响应走实时摄像头连续路径）
  cooldown_sec: 60           # 同源同类告警冷却（秒）
  sources: []                # 每项一个 RTSP/本地视频源，如 ["rtsp://user:pass@host:554/stream"]；也可用 "demo://" 作为无需真实视频源的示例源（见 core/video_source.py）

# ================= 工单派发规则（v0.2 工单闭环）=================
# 数据驱动、自上而下首中即用；assignee 填用户名（须为 responsible 角色）。
# scene/zone 均可省略视为通配；无命中时派发面板转手动下拉选择。
# 责任人默认整改时限按风险等级查表：重大1h / 较大2h / 一般24h / 低168h，可派发时覆盖。
dispatch:
  rules:
    - scene: hot_work
      assignee: lisi
    - scene: construction_ppe
      assignee: lisi

# ================= 语音转写（v0.4 可选增强 · 静默策略）=================
# OpenAI 兼容 /audio/transcriptions 端点。enabled=false 或字段不全时，
# 上报页语音入口完全不渲染（静默，无任何提示噪音）。不做本地 whisper/文件上传。
# 本地离线能力不受影响：文字表单路径零 LLM 依赖。
asr:
  enabled: false
  api_base: ""        # 例 https://api.openai.com/v1
  api_key: ""
  model: "whisper-1"
  timeout_sec: 30

# ================= AI 提取预填（v0.6 二期a · 双 Provider 降级链）=================
# 自由文本 → 四字段草稿预填（hazard_key/scene/description/location）。
# provider=auto：云(需 cloud.api_key)失败自动落本地 Ollama；均败退手填表单。
# 输出仅作预填草稿，人工确认后才建单；hazard_key 越白名单即弃。
enhance:
  provider: auto
  cloud:
    api_base: ""        # OpenAI 兼容端点,如 https://api.openai.com/v1
    api_key: ""
    model: "gpt-4o-mini"
    timeout_sec: 20
