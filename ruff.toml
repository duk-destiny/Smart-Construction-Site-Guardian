# ruff 最小门禁配置（v0.8）：只拦真问题——语法错误、未定义名、未使用导入/变量。
# 风格类规则（引号/行长/排序）不设，避免与既有代码风格冲突；后续可渐进收紧。
line-length = 110

[lint]
select = [
    "E9",   # 语法错误 / 缩进错误
    "F",    # pyflakes：未定义名(F821)、未使用导入(F401)、未使用变量(F841) 等
]

[lint.per-file-ignores]
# 脚本目录允许演示用一次性变量与过程式写法，仅拦未定义名
"scripts/*" = ["F401", "F841"]
"tests/*" = ["F401", "F841"]
